name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PUBLIC_SANITY_PROJECT_ID: f9johco4
  PUBLIC_SANITY_DATASET: production

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install public application dependencies
        run: npm ci

      - name: Install Sanity Studio dependencies
        run: npm ci --prefix sanity

      - name: Test connected-content relationship contract
        run: npm run test:content-relationships

      - name: Test connected-content presentation contract
        run: npm run test:connected-content-presentation

      - name: Test Forum relationship normalization
        run: npm run test:forum-relationships

      - name: Test Forum content request contract
        run: npm run test:forum-content-request

      - name: Test Forum content metadata orchestration
        run: npm run test:forum-content-metadata

      - name: Test Forum homepage discussion feed
        run: npm run test:forum-homepage-feed

      - name: Test Forum companion topic publisher
        run: npm run test:forum-publisher

      - name: Test Sanity Forum publishing workflow
        run: npm run test:forum-publishing-workflow

      - name: Run Astro Check
        run: npx astro check

      - name: Run production build
        run: npm run build
